<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albi Takarítási Beosztás</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; display: flex; justify-content: center; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 480px; width: 100%; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; font-size: 24px; }
        .week-info { text-align: center; color: #7f8c8d; font-weight: 600; margin-bottom: 20px; font-size: 14px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #f8f9fa; margin: 12px 0; padding: 15px; border-radius: 10px; border-left: 6px solid #e74c3c; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        li.done { border-left-color: #2ecc71; background: #eaaf3715; }
        .task-details { display: flex; flex-direction: column; gap: 4px; }
        .task { font-weight: bold; color: #34495e; font-size: 16px; }
        .person { color: #e67e22; font-size: 14px; font-weight: 600; }
        .btn-done { background: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-done:hover { background: #2980b9; }
        .btn-share { background: #0084FF; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-share:hover { background: #0073e6; }
        .status-badge { background: #2ecc71; color: white; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .penalty-badge { background: #e74c3c; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Takarítási Beosztás 🧹</h1>
    <div class="week-info" id="weekInfo">Betöltés...</div>
    <ul id="scheduleList"></ul>
    <button class="btn-share" onclick="shareToMessenger()">💬 Beosztás küldése Messengerre</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const members = ["Fruzsi", "Timi", "Ákos", "Máté"];
  const tasks = ["Fürdőszoba 🛁", "WC 🚽", "Konyha 🍳", "Közösségi 🧹"];

  // 1. Cseréld ki az adatbázis URL-edre!
  const firebaseConfig = { databaseURL: "https://albitakaritas-21461-default-rtdb.europe-west1.firebasedatabase.app/" };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const now = new Date();
  const startOfYear = new Date(now.getFullYear(), 0, 1);
  const currentWeek = Math.floor(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
  const weekKey = `${now.getFullYear()}_W${currentWeek}`;

  document.getElementById("weekInfo").innerText = `${now.getFullYear()}. ${currentWeek}. hét`;

  let globalScheduleText = "";

  // 2. Kezdő adatok ellenőrzése és generálása hétváltáskor
  async function checkAndGenerateSchedule() {
      const currentRef = ref(db, `current_schedule`);
      const snapshot = await get(currentRef);
      let scheduleData = snapshot.val();

      if (!scheduleData || scheduleData.weekKey !== weekKey) {
          let newAssignments = {};

          if (!scheduleData) {
              // Első indítás
              tasks.forEach((task, i) => {
                  newAssignments[i] = { task, member: members[i], isDone: false, isPenalty: false };
              });
          } else {
              // Hétváltás: Büntetés és rotálás
              const prevAssignments = scheduleData.assignments;
              let availableMembers = [];

              Object.keys(prevAssignments).forEach(i => {
                  const item = prevAssignments[i];
                  if (!item.isDone) {
                      newAssignments[i] = { task: item.task, member: item.member, isDone: false, isPenalty: true };
                  } else {
                      availableMembers.push(item.member);
                  }
              });

              availableMembers.push(availableMembers.shift()); // Elforgatás

              let availableIndex = 0;
              tasks.forEach((task, i) => {
                  if (!newAssignments[i]) {
                      newAssignments[i] = { 
                          task: task, 
                          member: availableMembers[availableIndex++], 
                          isDone: false, 
                          isPenalty: false 
                      };
                  }
              });
          }

          scheduleData = { weekKey, assignments: newAssignments };
          await set(currentRef, scheduleData);
      }
  }

  // 3. Valós idejű figyelés és kirajzolás
  function listenToSchedule() {
      const currentRef = ref(db, `current_schedule/assignments`);
      
      onValue(currentRef, (snapshot) => {
          const assignments = snapshot.val() || {};
          const scheduleList = document.getElementById("scheduleList");
          scheduleList.innerHTML = "";

          let shareText = `🧹 Takarítási Beosztás (${currentWeek}. hét):\n\n`;

          Object.keys(assignments).forEach(index => {
              const item = assignments[index];
              const li = document.createElement("li");
              if (item.isDone) li.classList.add("done");

              shareText += `${item.task}: ${item.member} ${item.isPenalty ? '⚠️(Büntetés)' : ''} ${item.isDone ? '✅' : '❌'}\n`;

              li.innerHTML = `
                  <div class="task-details">
                      <span class="task">${item.task}</span>
                      <span class="person">👤 ${item.member} ${item.isPenalty ? '<span class="penalty-badge">BÜNTETÉS</span>' : ''}</span>
                  </div>
                  <div>
                      ${item.isDone 
                          ? `<span class="status-badge">✔ Kész</span>` 
                          : `<button class="btn-done" onclick="markAsDone(${index})">Kész vagyok!</button>`}
                  </div>
              `;
              scheduleList.appendChild(li);
          });

          globalScheduleText = shareText;
      });
  }

  // 4. Gomb események
  window.markAsDone = async function(index) {
      const itemRef = ref(db, `current_schedule/assignments/${index}`);
      await update(itemRef, { isDone: true });
  };

  window.shareToMessenger = function() {
      const pageUrl = window.location.href;
      navigator.clipboard.writeText(globalScheduleText).then(() => {
          alert("Beosztás másolva a vágólapra! Illeszd be a megnyíló Messenger csoportba.");
          window.open(`https://www.facebook.com/dialog/send?link=${encodeURIComponent(pageUrl)}&app_id=291494419050&redirect_uri=${encodeURIComponent(pageUrl)}`, '_blank');
      }).catch(() => {
          window.open(`https://www.facebook.com/dialog/send?link=${encodeURIComponent(pageUrl)}&app_id=291494419050&redirect_uri=${encodeURIComponent(pageUrl)}`, '_blank');
      });
  };

  // Indítás
  checkAndGenerateSchedule().then(() => {
      listenToSchedule();
  });
</script>

</body>
</html>
