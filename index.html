<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albi Takarítási Beosztás</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; }
        h1 { color: #333; text-align: center; margin-bottom: 5px; }
        .week-info { text-align: center; color: #666; font-weight: bold; margin-bottom: 20px; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; margin: 10px 0; padding: 12px 15px; border-radius: 8px; border-left: 5px solid #4CAF50; display: flex; justify-content: space-between; }
        .task { font-weight: bold; color: #2c3e50; }
        .person { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>Takarítási Beosztás 🧹</h1>
    <div class="week-info" id="weekInfo"></div>
    <ul id="scheduleList"></ul>
</div>

<script>
    // 1. Tagok és Feladatok megadása
    const members = ["Ember 1", "Ember 2", "Ember 3", "Ember 4"]; // cseréld ki a neveitekre
    const tasks = ["Fürdőszoba 🛁", "WC 🚽", "Konyha 🍳", "Közös közlekedő 🧹"];

    // 2. Determinisztikus véletlenszám-generátor (hogy mindenkinél ugyanazt mutassa az oldalon)
    function seededRandom(seed) {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    // Tömb összekeverése adott seed alapján (Fisher-Yates)
    function shuffle(array, seed) {
        let m = array.length, t, i;
        let arr = [...array];
        while (m) {
            i = Math.floor(seededRandom(seed++) * m--);
            t = arr[m];
            arr[m] = arr[i];
            arr[i] = t;
        }
        return arr;
    }

    // 3. Jelenlegi hét kiszámítása az év elejétől
    const now = new Date();
    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const pastDays = (now - startOfYear) / 86400000;
    const currentWeek = Math.floor((pastDays + startOfYear.getDay() + 1) / 7);

    // 4. Ciklus és Rotáció kiszámítása
    const cycleIndex = Math.floor(currentWeek / 4); // Hányadik 4 hetes ciklusban vagyunk
    const weekInCycle = currentWeek % 4; // A ciklus hányadik hetében vagyunk (0, 1, 2, 3)

    // Véletlenszerű alap sorrend a ciklushoz (a ciklus száma a seed)
    const shuffledMembers = shuffle(members, cycleIndex * 999);

    // 5. Megjelenítés
    document.getElementById("weekInfo").innerText = `${now.getFullYear()}. ${currentWeek}. hét (${weekInCycle + 1}. hét a 4 hetes ciklusból)`;

    const scheduleList = document.getElementById("scheduleList");
    scheduleList.innerHTML = "";

    tasks.forEach((task, index) => {
        // A rotáció eltolása a hetek alapján
        const assignedMemberIndex = (index + weekInCycle) % 4;
        const assignedMember = shuffledMembers[assignedMemberIndex];

        const li = document.createElement("li");
        li.innerHTML = `<span class="task">${task}</span> <span class="person">${assignedMember}</span>`;
        scheduleList.appendChild(li);
    });
</script>

</body>
</html>
